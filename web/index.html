<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐕 Dog Breed Selector</title>
<meta name="description" content="Responde un cuestionario de 8 pasos y encontrá la raza de perro ideal para tu casa, tu tiempo y tu estilo de vida.">
<meta property="og:title" content="🐕 Dog Breed Selector">
<meta property="og:description" content="Responde un cuestionario de 8 pasos y encontrá la raza de perro ideal para tu casa, tu tiempo y tu estilo de vida.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐕</text></svg>">
<style>
  :root {
    --bg: #f4f5fb;
    --surface: #ffffff;
    --surface-muted: #f0f1f8;
    --border: #e2e4f0;
    --text: #1e2233;
    --text-muted: #6b7086;
    --accent: #5b5fef;
    --accent-dark: #4548c9;
    --accent-soft: #eeeeff;
    --success: #1a9e6b;
    --warning: #b5760a;
    --danger: #d0483c;
    --radius: 16px;
    --shadow: 0 8px 30px rgba(30, 34, 51, 0.08);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161f;
      --surface: #1c1f2c;
      --surface-muted: #232637;
      --border: #2d3143;
      --text: #eef0f8;
      --text-muted: #9498b0;
      --accent: #8b8ffb;
      --accent-dark: #a5a8fc;
      --accent-soft: #262a45;
      --success: #4bcf9a;
      --warning: #e0ab4c;
      --danger: #ef7168;
      --shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 20px 14px 60px;
    line-height: 1.45;
  }
  .app { max-width: 620px; margin: 0 auto; }
  header.topbar { text-align: center; margin-bottom: 24px; }
  header.topbar h1 { font-size: 1.7em; margin-bottom: 4px; }
  header.topbar p { color: var(--text-muted); font-size: 0.95em; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
  }

  /* --- Wizard --- */
  .progress-track {
    height: 6px;
    background: var(--surface-muted);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.3s ease;
    width: 0%;
  }
  .step-label {
    color: var(--text-muted);
    font-size: 0.85em;
    margin-bottom: 18px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .category-title { font-size: 1.25em; margin-bottom: 18px; }
  .field { margin-bottom: 20px; }
  .field label.field-label {
    display: block;
    font-weight: 600;
    margin-bottom: 4px;
    font-size: 0.95em;
  }
  .field .help {
    color: var(--text-muted);
    font-size: 0.82em;
    margin-bottom: 8px;
    line-height: 1.4;
  }
  select, input[type="number"] {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 16px;
    background: var(--surface);
    color: var(--text);
    font-family: inherit;
  }
  select:focus, input[type="number"]:focus {
    outline: none;
    border-color: var(--accent);
  }
  .segmented {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .segmented button {
    flex: 1 1 auto;
    min-width: 90px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 0.9em;
    cursor: pointer;
    font-family: inherit;
  }
  .segmented button.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .wizard-nav {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 26px;
  }
  button.btn-primary, button.btn-secondary {
    padding: 13px 22px;
    border-radius: 999px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    font-family: inherit;
  }
  button.btn-primary {
    background: var(--accent);
    color: #fff;
    flex: 1;
  }
  button.btn-primary:hover { background: var(--accent-dark); }
  button.btn-secondary {
    background: transparent;
    color: var(--text-muted);
    border: 1.5px solid var(--border);
  }
  button.btn-secondary:disabled { opacity: 0.35; cursor: default; }
  button:disabled { cursor: not-allowed; opacity: 0.5; }

  .dots { display: flex; justify-content: center; gap: 6px; margin: 18px 0 6px; }
  .dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--border); }
  .dots span.done { background: var(--accent); }
  .dots span.current { background: var(--accent); transform: scale(1.4); }
  .restart-link { text-align: center; margin-top: 4px; }
  .restart-link button {
    background: none; border: none; color: var(--text-muted);
    font-size: 0.8em; text-decoration: underline; cursor: pointer; font-family: inherit;
  }

  /* --- Results --- */
  #results { margin-top: 8px; }
  .results-header { text-align: center; margin-bottom: 18px; }
  .results-header h2 { font-size: 1.3em; margin-bottom: 4px; }
  .results-header p { color: var(--text-muted); font-size: 0.9em; }

  .hero-card {
    background: linear-gradient(160deg, var(--accent-soft), var(--surface));
    border: 1.5px solid var(--accent);
    border-radius: var(--radius);
    padding: 22px;
    margin-bottom: 14px;
  }
  .hero-rank { font-size: 0.78em; font-weight: 700; color: var(--accent-dark); text-transform: uppercase; letter-spacing: 0.06em; }
  .hero-name { font-size: 1.5em; font-weight: 700; margin: 2px 0 6px; }
  .hero-score-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .score-pill {
    display: inline-block;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 0.95em;
  }
  .rating-label { color: var(--text-muted); font-size: 0.88em; }
  .why-row { font-size: 0.83em; color: var(--success); font-weight: 600; margin-bottom: 10px; }
  .nudge {
    background: var(--surface-muted);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.85em;
    color: var(--text-muted);
    margin-bottom: 14px;
  }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip {
    background: var(--surface-muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 0.75em;
    color: var(--text);
    white-space: nowrap;
  }
  .note-list { margin-top: 8px; font-size: 0.88em; }
  .note-list .note { padding: 3px 0; color: var(--text-muted); }
  .note-list .note.warn { color: var(--warning); }
  .note-list .note.block { color: var(--danger); font-weight: 600; }

  .compact-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 8px;
  }
  .compact-row .name { font-weight: 600; }
  .compact-row .name .rank { color: var(--text-muted); font-weight: 400; margin-right: 4px; }
  .compact-row .score-pill { background: var(--surface-muted); color: var(--text); }

  details.more-results { margin-top: 14px; }
  details.more-results summary {
    cursor: pointer;
    color: var(--accent-dark);
    font-weight: 600;
    font-size: 0.9em;
    padding: 8px 0;
  }

  .results-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .results-actions button { flex: 1 1 auto; }
  #shareStatus { text-align: center; font-size: 0.85em; color: var(--success); margin-top: 8px; min-height: 1.2em; }

  footer { text-align: center; color: var(--text-muted); margin-top: 34px; font-size: 0.85em; }
  footer a { color: var(--accent-dark); }

  [hidden] { display: none !important; }

  .boot-state { text-align: center; color: var(--text-muted); }
  .boot-state p { margin-bottom: 14px; }
  .spinner {
    width: 28px; height: 28px; margin: 0 auto 14px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 420px) {
    body { padding: 14px 10px 40px; }
    .card { padding: 18px; }
  }
</style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>🐕 Dog Breed Selector</h1>
      <p>Responde 8 pasos cortos y encuentra la raza de perro ideal para tu vida</p>
    </header>

    <div id="bootLoading" class="card boot-state">
      <div class="spinner"></div>
      <p>Cargando el cuestionario…</p>
    </div>

    <div id="bootError" class="card boot-state" hidden>
      <p>⚠️ No se pudo cargar el cuestionario. Puede ser tu conexión o un problema temporal del sitio.</p>
      <button type="button" class="btn-primary">Reintentar</button>
    </div>

    <main id="wizard" class="card" hidden>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progressTrack">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p class="step-label" id="stepLabel">Paso 1</p>
      <form id="stepForm">
        <h2 class="category-title" id="categoryTitle"></h2>
        <div id="stepFields"></div>
        <div class="wizard-nav">
          <button type="button" id="btnBack" class="btn-secondary">Atrás</button>
          <button type="submit" id="btnNext" class="btn-primary">Siguiente</button>
        </div>
      </form>
      <div class="dots" id="dots"></div>
      <p class="restart-link"><button type="button" id="btnRestart">Empezar de nuevo</button></p>
    </main>

    <section id="results" class="card" hidden></section>

    <footer>
      <p>Dog Breed Selector · <a href="https://github.com/fmarquezarate-png/dog-breed-selector">@fmarquezarate-png</a></p>
    </footer>
  </div>

<script type="module">
import { createCalculator } from './engine.js';

const OPTION_LABELS = {}; // id -> {value: label}
let QUESTIONS = null;
let BREEDS = null;
let CALC = null;
let categories = [];
let stepIndex = 0;
const answers = {};

const STORAGE_KEY = 'dbs_answers_v1';

function loadSavedAnswers() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch {
    return {}; // localStorage puede fallar (privado, cuota, navegador viejo): seguir sin recordar nada
  }
}

function saveAnswers() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(answers));
  } catch {
    // no pasa nada si no se puede persistir; el formulario sigue funcionando en memoria
  }
}

async function fetchJSON(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(`${path}: HTTP ${res.status}`);
  return res.json();
}

async function boot() {
  let q, b;
  try {
    [q, b] = await Promise.all([fetchJSON('./questions.json'), fetchJSON('./breeds.json')]);
  } catch (err) {
    showBootError();
    return;
  }
  QUESTIONS = q;
  BREEDS = b.breeds;
  CALC = createCalculator(q.categories);
  categories = Object.entries(q.categories); // [ [id, {label, questions...}], ... ]

  const saved = loadSavedAnswers();
  // Defaults primero, respuestas guardadas encima: así avanzar sin tocar nada
  // sigue produciendo un resultado válido, y volver a la pestaña no borra nada.
  for (const [, cat] of categories) {
    for (const question of cat.questions) {
      if ('default' in question) answers[question.id] = question.default;
      if (question.id in saved) answers[question.id] = saved[question.id];
      OPTION_LABELS[question.id] = Object.fromEntries((question.options || []).map(o => [o.value, o.label]));
    }
  }

  document.getElementById('wizard').hidden = false;
  document.getElementById('bootLoading').hidden = true;
  renderStep();
}

function showBootError() {
  document.getElementById('bootLoading').hidden = true;
  const el = document.getElementById('bootError');
  el.hidden = false;
  el.querySelector('button').addEventListener('click', () => location.reload());
}

function fieldHTML(question) {
  const value = answers[question.id];
  const help = question.help ? `<p class="help">${question.help}</p>` : '';
  if (question.type === 'number') {
    return `
      <div class="field" data-id="${question.id}">
        <label class="field-label" for="f_${question.id}">${question.label}</label>
        ${help}
        <input type="number" inputmode="numeric" id="f_${question.id}" min="${question.min ?? ''}" max="${question.max ?? ''}" value="${value ?? ''}">
      </div>`;
  }
  if (question.type === 'boolean') {
    return `
      <div class="field" data-id="${question.id}">
        <label class="field-label">${question.label}</label>
        ${help}
        <div class="segmented" data-bool="${question.id}">
          <button type="button" data-val="true" aria-pressed="${value === true}" class="${value === true ? 'active' : ''}">Sí</button>
          <button type="button" data-val="false" aria-pressed="${value === false}" class="${value === false ? 'active' : ''}">No</button>
        </div>
      </div>`;
  }
  // single_choice
  const options = (question.options || []).map(o =>
    `<option value="${o.value}" ${o.value === value ? 'selected' : ''}>${o.label}</option>`
  ).join('');
  return `
    <div class="field" data-id="${question.id}">
      <label class="field-label" for="f_${question.id}">${question.label}</label>
      ${help}
      <select id="f_${question.id}">${options}</select>
    </div>`;
}

const CATEGORY_ICONS = {
  hogar: '🏠', estilo_vida: '🏃', experiencia: '📚', preferencias_fisicas: '🎨',
  salud: '🏥', personalidad: '🐾', cuidados: '✂️', objetivos: '🎯',
};

function setAnswer(id, value) {
  answers[id] = value;
  saveAnswers();
}

function renderStep() {
  const [catId, cat] = categories[stepIndex];
  document.getElementById('categoryTitle').textContent = `${CATEGORY_ICONS[catId] || ''} ${cat.label}`;
  document.getElementById('stepLabel').textContent = `Paso ${stepIndex + 1} de ${categories.length}`;
  const pct = Math.round(((stepIndex + 1) / categories.length) * 100);
  document.getElementById('progressFill').style.width = `${pct}%`;
  document.getElementById('progressTrack').setAttribute('aria-valuenow', String(pct));
  document.getElementById('stepFields').innerHTML = cat.questions.map(fieldHTML).join('');

  document.getElementById('btnBack').disabled = stepIndex === 0;
  document.getElementById('btnNext').textContent =
    stepIndex === categories.length - 1 ? '🐕 Ver mis razas ideales' : 'Siguiente';

  // wire inputs
  for (const question of cat.questions) {
    if (question.type === 'boolean') {
      const wrap = document.querySelector(`[data-bool="${question.id}"]`);
      wrap.querySelectorAll('button').forEach(btn => {
        btn.addEventListener('click', () => {
          setAnswer(question.id, btn.dataset.val === 'true');
          wrap.querySelectorAll('button').forEach(b => {
            b.classList.remove('active');
            b.setAttribute('aria-pressed', 'false');
          });
          btn.classList.add('active');
          btn.setAttribute('aria-pressed', 'true');
        });
      });
    } else if (question.type === 'number') {
      const el = document.getElementById(`f_${question.id}`);
      el.addEventListener('input', () => {
        // No pisar la respuesta con 0 mientras el usuario borra el campo para
        // reescribirlo — un 0 silencioso aquí puede disparar dealbreakers falsos.
        if (el.value === '') return;
        const n = Number(el.value);
        if (Number.isFinite(n)) setAnswer(question.id, n);
      });
      el.addEventListener('blur', () => {
        let n = Number(el.value);
        if (!Number.isFinite(n)) n = answers[question.id] ?? question.default;
        if (question.min != null) n = Math.max(question.min, n);
        if (question.max != null) n = Math.min(question.max, n);
        el.value = n;
        setAnswer(question.id, n);
      });
    } else {
      const el = document.getElementById(`f_${question.id}`);
      el.addEventListener('change', () => setAnswer(question.id, el.value));
    }
  }

  renderDots();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderDots() {
  document.getElementById('dots').innerHTML = categories.map((_, i) => {
    const cls = i === stepIndex ? 'current' : i < stepIndex ? 'done' : '';
    return `<span class="${cls}"></span>`;
  }).join('');
}

document.getElementById('btnBack').addEventListener('click', () => {
  if (stepIndex > 0) { stepIndex -= 1; renderStep(); }
});

document.getElementById('btnRestart').addEventListener('click', () => {
  if (!confirm('¿Borrar tus respuestas y empezar de nuevo?')) return;
  for (const key of Object.keys(answers)) delete answers[key];
  for (const [, cat] of categories) {
    for (const question of cat.questions) {
      if ('default' in question) answers[question.id] = question.default;
    }
  }
  try { localStorage.removeItem(STORAGE_KEY); } catch {}
  stepIndex = 0;
  renderStep();
});

document.getElementById('stepForm').addEventListener('submit', (e) => {
  e.preventDefault();
  if (stepIndex < categories.length - 1) {
    stepIndex += 1;
    renderStep();
  } else {
    showResults();
  }
});

function ratingClass(pct) {
  if (pct >= 80) return 'success';
  if (pct >= 60) return '';
  return 'warn';
}

function renderBreedNotes(score) {
  const items = [];
  score.dealbreakers.forEach(d => items.push(`<div class="note block">⛔ ${d}</div>`));
  score.considerations.forEach(c => items.push(`<div class="note">💡 ${c}</div>`));
  return items.length ? `<div class="note-list">${items.join('')}</div>` : '';
}

function topStrengths(score) {
  const labels = Object.fromEntries(categories.map(([id, cat]) => [id, cat.label]));
  return Object.entries(score.category_scores)
    .filter(([, value]) => value >= 75)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 3)
    .map(([id]) => labels[id] || id);
}

function heroCardHTML(score, rank) {
  const strengths = topStrengths(score);
  const why = strengths.length
    ? `<p class="why-row">✓ Coincide especialmente en: ${strengths.join(' · ')}</p>` : '';
  return `
    <div class="hero-card">
      <div class="hero-rank">${rank === 1 ? 'Tu raza ideal' : `#${rank} recomendado`}</div>
      <div class="hero-name">${score.breed_name_es}</div>
      <div class="hero-score-row">
        <span class="score-pill">${score.match_percentage}% compatible</span>
        <span class="rating-label">${score.rating}</span>
      </div>
      ${why}
      <div class="chip-row">${score.key_traits.map(t => `<span class="chip">${t}</span>`).join('')}</div>
      ${renderBreedNotes(score)}
    </div>`;
}

function compactRowHTML(score, rank) {
  return `
    <div class="compact-row">
      <span class="name"><span class="rank">#${rank}</span>${score.breed_name_es}</span>
      <span class="score-pill">${score.match_percentage}%</span>
    </div>`;
}

function buildShareText(results) {
  const top = results[0];
  const lines = [
    `🐕 Mi raza ideal según Dog Breed Selector: ${top.breed_name_es} (${top.match_percentage}% compatible)`,
    '',
    'Top 3:',
    ...results.slice(0, 3).map((s, i) => `${i + 1}. ${s.breed_name_es} — ${s.match_percentage}%`),
    '',
    `Hacé el test vos también: ${location.origin}${location.pathname}`,
  ];
  return lines.join('\n');
}

function showResults() {
  const results = CALC.scoreAllBreeds(answers, BREEDS);
  const top5 = results.slice(0, 5);

  document.getElementById('wizard').hidden = true;
  const section = document.getElementById('results');
  section.hidden = false;

  const moreRows = top5.slice(1, 3).map((s, i) => compactRowHTML(s, i + 2)).join('');
  const extraRows = top5.slice(3, 5).map((s, i) => compactRowHTML(s, i + 4)).join('');
  const vagueAnswers = answers.preferred_size === 'no_preference';
  const nudge = vagueAnswers
    ? `<p class="nudge">💡 Elegiste "sin preferencia" en tamaño — respondé esa pregunta para afinar mucho más el resultado.</p>`
    : '';

  section.innerHTML = `
    <div class="results-header">
      <h2>🏆 Tus razas ideales</h2>
      <p>Según tus respuestas, esto es lo que más encaja contigo</p>
    </div>
    ${nudge}
    ${heroCardHTML(top5[0], 1)}
    ${moreRows}
    ${extraRows ? `<details class="more-results"><summary>Ver 2 más</summary>${extraRows}</details>` : ''}
    <div class="results-actions">
      <button class="btn-secondary" id="btnEdit">✏️ Editar respuestas</button>
      <button class="btn-primary" id="btnShare">📤 Compartir resultado</button>
    </div>
    <p id="shareStatus" aria-live="polite"></p>
  `;

  document.getElementById('btnEdit').addEventListener('click', () => {
    section.hidden = true;
    document.getElementById('wizard').hidden = false;
    stepIndex = 0;
    renderStep();
  });

  document.getElementById('btnShare').addEventListener('click', async () => {
    const text = buildShareText(top5);
    const status = document.getElementById('shareStatus');
    try {
      if (navigator.share) {
        await navigator.share({ title: 'Dog Breed Selector', text });
        return;
      }
      await navigator.clipboard.writeText(text);
      status.textContent = '✓ Copiado al portapapeles — pégalo donde quieras';
    } catch (err) {
      if (err && err.name === 'AbortError') return; // usuario canceló el share nativo
      status.textContent = '✓ ' + text.split('\n')[0];
    }
  });
}

boot();
